name: Feature request / 기능 제안
description: Suggest an improvement / 개선 아이디어를 제안해주세요
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem first, then the proposed solution.

        먼저 사용 중 겪는 불편을 설명하고, 그다음 원하는 해결 방법을 적어주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 작성 전 확인
      options:
        - label: I searched existing issues for the same request. / 같은 제안이 있는지 기존 이슈를 검색했습니다.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 문제 또는 사용 사례
      description: What are you trying to accomplish? / 무엇을 하려는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior / 원하는 동작
      description: Describe the simplest useful result. / 가장 단순하고 유용한 결과를 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 대안
      description: How do you handle this today? / 현재는 어떻게 해결하고 있나요?

  - type: textarea
    id: context
    attributes:
      label: Additional context / 추가 정보
      description: Mockups, example workflows, or related links / 화면 예시, 워크플로우 또는 관련 링크
