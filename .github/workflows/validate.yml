name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Python syntax
        run: python -m py_compile __init__.py nodes.py utils.py tests/test_utils.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate frontend JavaScript syntax
        run: node --check web/video_comparer_v7.js

      - name: Validate metadata, public docs, and examples
        run: |
          python - <<'PY'
          import json
          import pathlib
          import struct

          root = pathlib.Path(".")
          metadata = (root / "pyproject.toml").read_text(encoding="utf-8")
          assert 'name = "video-comparer"' in metadata
          assert 'license = { file = "LICENSE" }' in metadata
          assert 'PublisherId = "aiegobot"' in metadata
          assert 'assets/registry-icon.png' in metadata
          assert 'assets/registry-banner.png' in metadata

          workflows = [
              root / "example_workflows" / "video_comparer_smoke.json",
              root / "example_workflows" / "video_comparer_load_and_record.json",
          ]
          for path in workflows:
              text = path.read_text(encoding="utf-8")
              assert "D:\\" not in text and "C:\\" not in text and "/home/" not in text
              workflow = json.loads(text)
              node_types = {node["type"] for node in workflow["nodes"]}
              assert {"IndiVideoComparer", "SaveVideo"} <= node_types

          readme = (root / "README.md").read_text(encoding="utf-8")
          assert "## English" in readme and "## 한국어" in readme
          assert "ComfyUI Manager — recommended" in readme
          assert "Install via Git URL" in readme
          assert "git clone https://github.com/AIEGOBOT/ComfyUI-VideoComparer.git" in readme

          required_public_files = [
              "README.md",
              "LICENSE",
              "CHANGELOG.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "docs/INSTALLATION.md",
              "docs/TROUBLESHOOTING.md",
              "docs/IndiVideoComparer.md",
              ".github/ISSUE_TEMPLATE/bug_report.yml",
              ".github/ISSUE_TEMPLATE/feature_request.yml",
              ".github/ISSUE_TEMPLATE/config.yml",
              ".github/PULL_REQUEST_TEMPLATE.md",
          ]
          for relative in required_public_files:
              path = root / relative
              assert path.is_file() and path.stat().st_size > 0, relative

          for path in list(root.rglob("*.md")) + workflows:
              text = path.read_text(encoding="utf-8")
              assert "D:\\" not in text, path
              assert "C:\\Users\\" not in text, path
              assert "/home/" not in text, path

          demo = root / "docs" / "assets" / "video-comparer-demo.mp4"
          poster = root / "docs" / "assets" / "video-comparer-demo-poster.jpg"
          workflow_screenshot = root / "docs" / "assets" / "video-comparer-workflow.png"
          assert demo.is_file() and 0 < demo.stat().st_size < 20 * 1024 * 1024
          assert poster.is_file() and poster.stat().st_size > 0
          assert workflow_screenshot.is_file() and 0 < workflow_screenshot.stat().st_size < 10 * 1024 * 1024

          def png_size(path):
              with path.open("rb") as handle:
                  assert handle.read(8) == b"\x89PNG\r\n\x1a\n"
                  length = struct.unpack(">I", handle.read(4))[0]
                  assert handle.read(4) == b"IHDR" and length == 13
                  return struct.unpack(">II", handle.read(8))

          assert png_size(root / "assets" / "registry-icon.png") == (400, 400)
          assert png_size(root / "assets" / "registry-banner.png") == (1400, 600)

          comfyignore = (root / ".comfyignore").read_text(encoding="utf-8")
          for excluded in (
              ".github/",
              "tests/",
              "docs/assets/",
              "assets/",
              "AGENTS.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
          ):
              assert excluded in comfyignore

          publish_workflow = (root / ".github" / "workflows" / "publish_action.yml").read_text(encoding="utf-8")
          assert "workflow_dispatch:" in publish_workflow
          assert "REGISTRY_ACCESS_TOKEN" in publish_workflow
          print("metadata-and-workflow-ok")
          PY
