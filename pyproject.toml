[project]
name = "video-comparer"
version = "0.1.1"
description = "Compare two ComfyUI videos with a synchronized swipe slider. Review upscaling, reference matching, and A/B results, then record the comparison to Save Video."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/AIEGOBOT/ComfyUI-VideoComparer"
Issues = "https://github.com/AIEGOBOT/ComfyUI-VideoComparer/issues"

[tool.comfy]
PublisherId = "aiegobot"
DisplayName = "ComfyUI Video Comparer"
Icon = "https://raw.githubusercontent.com/AIEGOBOT/ComfyUI-VideoComparer/main/assets/registry-icon.png"
Banner = "https://raw.githubusercontent.com/AIEGOBOT/ComfyUI-VideoComparer/main/assets/registry-banner.png"
requires-comfyui = ">=0.33.1"
